name: Update EDINET Network Data

on:
  schedule:
    # 毎週日曜 18:00 UTC（日本時間 月曜 03:00）に新着有報と時価総額を差分更新
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      from_date:
        description: '走査開始日 (YYYY-MM-DD、空欄なら直近days日分)'
        required: false
        default: ''
      to_date:
        description: '走査終了日 (YYYY-MM-DD、空欄なら今日)'
        required: false
        default: ''
      days:
        description: '遡り日数（from_date未指定時）'
        required: false
        default: '14'
      max_downloads:
        description: '1回で取得・解析する有報の上限件数'
        required: false
        default: '150'
      market_cap_limit:
        description: '1回で時価総額を更新する上限社数（ネットワーク出現企業を優先）'
        required: false
        default: '500'

permissions:
  contents: write

concurrency:
  group: update-edinet-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check EDINET_API_KEY secret
        id: check_key
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: |
          if [ -z "$EDINET_API_KEY" ]; then
            echo "EDINET_API_KEY が GitHub Secrets に未登録のためスキップします。"
            echo "Settings > Secrets and variables > Actions に EDINET_API_KEY を登録すると自動更新が有効になります。"
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.check_key.outputs.has_key == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'python/requirements.txt'

      - name: Install Python dependencies
        if: steps.check_key.outputs.has_key == 'true'
        run: pip install -r python/requirements.txt

      - name: Restore parsed EDINET cache
        if: steps.check_key.outputs.has_key == 'true'
        uses: actions/cache@v4
        with:
          path: data/cache
          key: edinet-cache-${{ github.run_id }}
          restore-keys: |
            edinet-cache-

      - name: Run EDINET network pipeline
        if: steps.check_key.outputs.has_key == 'true'
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: |
          ARGS=(
            --days "${{ inputs.days || '14' }}"
            --max-downloads "${{ inputs.max_downloads || '150' }}"
            --market-cap-limit "${{ inputs.market_cap_limit || '300' }}"
            --out-dir public/data
          )
          if [ -n "${{ inputs.from_date }}" ]; then
            ARGS+=(--from "${{ inputs.from_date }}")
          fi
          if [ -n "${{ inputs.to_date }}" ]; then
            ARGS+=(--to "${{ inputs.to_date }}")
          fi
          python python/run_pipeline.py "${ARGS[@]}"

      - name: Commit updated split JSON data
        if: steps.check_key.outputs.has_key == 'true'
        run: |
          if [ ! -d public/data ]; then
            echo "public/data が未生成のためコミットをスキップします。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "データに差分はありません。"
            exit 0
          fi
          git commit -m "chore(data): update EDINET network split JSON"
          git push
